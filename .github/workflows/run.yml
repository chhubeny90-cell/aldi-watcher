name: Multi-Provider Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: aldi-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install selenium

      - name: Run watcher
        env:
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          LIDL_USER: ${{ secrets.LIDL_USER }}
          LIDL_PASS: ${{ secrets.LIDL_PASS }}
          AUTO_BOOK_ENABLED: 'true'
        run: python watcher.py
        continue-on-error: true
