name: ALDI Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        default: all
        type: choice
        options:
          - all
          - tests
          - watch
          - public-probe
          - sso-diagnostic
  schedule:
    # Keep CI alive while live ALDI authentication is paused during credential diagnosis.
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: aldi-watcher-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

env:
  # Production booking remains disabled until authenticated free-1GB flow is verified end-to-end.
  AUTO_BOOK_ENABLED: 'false'

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'tests' || inputs.mode == 'watch')) ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q

  watch:
    # Live authentication is intentionally manual/tag-triggered while the current
    # ALDI login identifier is being diagnosed. This prevents repeated lockouts.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'watch')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[live-watch]'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify read-only safety guard
        run: |
          test "$AUTO_BOOK_ENABLED" = "false"
          echo "Read-only safety guard active."
      - name: Run one ALDI watcher attempt
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
        shell: bash
        run: |
          rm -f monitoring-report.json
          timeout 180s python watcher.py --run-once --provider aldi_talk --report monitoring-report.json
      - name: Preserve sanitized watcher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-report.json
          retention-days: 7
          if-no-files-found: warn

  public_probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'all' || inputs.mode == 'public-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect public portal pages without credentials
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python portal_probe.py
      - name: Preserve public portal diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal-probe-report.json
          retention-days: 7
          if-no-files-found: warn

  sso_diagnostic:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'sso-diagnostic')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[sso-watch]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run one sanitized SSO observation
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_SSO_OBSERVE_SECONDS: '30'
          ALDI_SSO_SAMPLE_SECONDS: '2'
          ALDI_SSO_REPORT: aldi-sso-diagnostic.json
        run: python aldi_sso_dom_diagnostic.py
      - name: Preserve sanitized SSO diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-sso-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-sso-diagnostic.json
          retention-days: 3
          if-no-files-found: warn
