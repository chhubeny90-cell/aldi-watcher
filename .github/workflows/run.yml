name: Aldi Watcher

on:
  schedule:
    - cron: '*/5 * * * *'  # alle 5 Minuten (GitHub Minimum)
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run watcher
        env:
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          LIDL_USER: ${{ secrets.LIDL_USER }}
          LIDL_PASS: ${{ secrets.LIDL_PASS }}
        run: python watcher.py
