name: CI and Safe Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: aldi-watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q

  watch:
    # Manual runs are allowed. Scheduled live auth stays off until the account
    # credentials have been verified and ALDI_MONITORING_ENABLED is explicitly true.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.ALDI_MONITORING_ENABLED == 'true')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ALDI watcher in safety mode
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_ACCOUNT_SELECTOR: ${{ vars.ALDI_ACCOUNT_SELECTOR }}
          ALDI_ACTIVE_TARIFF_SELECTOR: ${{ vars.ALDI_ACTIVE_TARIFF_SELECTOR }}
          ALDI_REFILL_OFFER_SELECTOR: ${{ vars.ALDI_REFILL_OFFER_SELECTOR }}
          ALDI_REFILL_BUTTON_SELECTOR: ${{ vars.ALDI_REFILL_BUTTON_SELECTOR }}
          ALDI_REFILL_SUCCESS_SELECTOR: ${{ vars.ALDI_REFILL_SUCCESS_SELECTOR }}
          ALDI_REFILL_RECONCILE_SELECTOR: ${{ vars.ALDI_REFILL_RECONCILE_SELECTOR }}
          AUTO_BOOK_ENABLED: 'false'
        run: python watcher.py --run-once --provider aldi_talk
      - name: Preserve sanitized heartbeat and diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-report.json
          retention-days: 7
          if-no-files-found: warn
