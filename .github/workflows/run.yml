name: ALDI Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        default: all
        type: choice
        options:
          - all
          - tests
          - public-probe

permissions:
  contents: read

env:
  # Authenticated ALDI portal automation remains disabled.
  DRY_RUN: 'true'
  AUTO_BOOK_ENABLED: 'false'
  DB_PATH: workflow-errors.db

jobs:
  setup_python_update_regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify setup-python workflow version expectations
        run: >-
          python -m pytest -q
          tests/test_workflow_auth_hardening.py::test_24_7_active_workflows_use_node24_compatible_action_generations

  test:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q
      - name: Record failed test job
        if: failure()
        run: |
          python - <<'PY'
          import os
          from core.database import Database
          db = Database(os.environ['DB_PATH'])
          db.log_error('github_actions', 'tests', 'test_job_failed')
          PY
      - name: Preserve test diagnosis
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DB_PATH }}
          retention-days: 7
          if-no-files-found: ignore

  public_probe:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'public-probe'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect public portal pages without credentials
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python portal_probe.py
      - name: Record failed public probe job
        if: failure()
        run: |
          python - <<'PY'
          import os
          from core.database import Database
          db = Database(os.environ['DB_PATH'])
          db.log_error('github_actions', 'public_probe', 'public_probe_job_failed')
          PY
      - name: Preserve public portal diagnosis
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-portal-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            portal-probe-report.json
            ${{ env.DB_PATH }}
          retention-days: 7
          if-no-files-found: warn
