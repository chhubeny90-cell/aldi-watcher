name: ALDI Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        default: all
        type: choice
        options:
          - all
          - tests
          - public-probe

permissions:
  contents: read

env:
  # ALDI TALK stated on 2026-10-13 that automated scripts/browser control
  # of the authenticated customer portal are not authorized.
  AUTO_BOOK_ENABLED: 'false'

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q

  public_probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'all' || inputs.mode == 'public-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect public portal pages without credentials
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python portal_probe.py
      - name: Preserve public portal diagnosis
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: public-portal-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal-probe-report.json
          retention-days: 7
          if-no-files-found: warn
