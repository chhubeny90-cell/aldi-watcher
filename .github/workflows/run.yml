name: CI and Safe Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: aldi-watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests run independently so scheduled read-only monitoring is not blocked by
  # the test job. Booking stays disabled in the watcher job regardless.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q

  watch:
    # Run only for explicit manual checks and the cron schedule.
    # Booking remains hard-disabled by AUTO_BOOK_ENABLED=false.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTO_BOOK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify read-only safety guard
        run: |
          test "$AUTO_BOOK_ENABLED" = "false"
          echo "Read-only safety guard active; booking is disabled."
      - name: Run ALDI watcher with bounded automatic restart
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
        shell: bash
        run: |
          set -u
          attempts=3
          last_rc=1

          for attempt in $(seq 1 "$attempts"); do
            echo "==> Read-only watcher attempt ${attempt}/${attempts}"
            rm -f monitoring-report.json

            set +e
            timeout 180s python watcher.py \
              --run-once \
              --provider aldi_talk \
              --report monitoring-report.json
            last_rc=$?
            set -e

            if [ "$last_rc" -eq 0 ]; then
              echo "Watcher completed successfully."
              exit 0
            fi

            # Exit code 3 is a configuration/secrets problem. Retrying the same
            # configuration would only create unnecessary login attempts.
            if [ "$last_rc" -eq 3 ]; then
              echo "Configuration error detected; not retrying."
              exit 3
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              delay=$((30 * attempt))
              echo "Watcher interrupted/failed (exit ${last_rc}); restarting in ${delay}s."
              sleep "$delay"
            fi
          done

          echo "Watcher still failed after ${attempts} attempts (last exit ${last_rc})."
          exit "$last_rc"
      - name: Preserve sanitized heartbeat and diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-report.json
          retention-days: 7
          if-no-files-found: warn
