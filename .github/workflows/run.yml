name: ALDI Watcher

on:
  push:
    branches: [main, develop, 'hardening/**', 'feature/**', 'fix/**']
  pull_request:
  repository_dispatch:
    types: [aldi-usage-alert]
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run do?
        required: true
        default: all
        type: choice
        options:
          - all
          - tests
          - watch
          - public-probe
          - live-refill
  schedule:
    # Automatic guarded live check every 10 minutes, offset from the hour.
    - cron: '3-59/10 * * * *'

permissions:
  contents: read

env:
  # Default remains read-only; only the isolated guarded live-refill job opts in.
  AUTO_BOOK_ENABLED: 'false'

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'tests' || inputs.mode == 'watch' || inputs.mode == 'live-refill'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q
      - name: Report live execution prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-refill'
        run: |
          python - <<'PY'
          import json
          print(json.dumps({
              'live_mode_requested': True,
              'runner': 'github-hosted-linux',
              'journal_storage': 'public-safe-state-branch',
              'booking_limit_per_run': 1,
              'manual_auth_once': True,
          }))
          PY

  watch:
    # Optional read-only diagnosis; live refill performs its own login and checks.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.mode == 'all' || inputs.mode == 'watch')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[live-watch]'))
    strategy:
      fail-fast: false
      matrix:
        profile: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify read-only safety guard
        run: |
          test "$AUTO_BOOK_ENABLED" = "false"
          echo "Read-only safety guard active."
      - name: Run one ALDI watcher attempt
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets[format('ALDI_PROFILE_{0}_LOGIN_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_LOGIN_USER) || '' }}
          ALDI_USER: ${{ secrets[format('ALDI_PROFILE_{0}_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_USER) || '' }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_LOGIN_USER_ENC: ${{ secrets.ALDI_LOGIN_USER_ENC }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
        shell: bash
        run: |
          rm -f monitoring-report.json
          timeout 180s python watcher.py --run-once --provider aldi_talk --report monitoring-report.json
      - name: Preserve sanitized watcher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-report.json
          retention-days: 7
          if-no-files-found: warn

  live_refill:
    # Schedule, explicit dispatch, usage-mail dispatch, and an explicit main-branch
    # canary marker all use the same free-only flow. No workflow concurrency lock
    # is used; the remote state SHA is the atomic pre-click reservation guard.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'repository_dispatch' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-refill') ||
       (github.event_name == 'push' &&
        contains(github.event.head_commit.message, '[live-refill-canary]')))
    strategy:
      fail-fast: false
      matrix:
        profile: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # This job updates only non-sensitive durable guard/proof/heartbeat state.
      contents: write
    env:
      AUTO_BOOK_ENABLED: 'true'
      ALDI_MAX_REFILLS_PER_RUN: '1'
      ALDI_JOURNAL_PATH: /tmp/aldi-watcher-live.db
      ALDI_REMOTE_JOURNAL: 'true'
      ALDI_STATE_PATH: .aldi-state/profile-${{ matrix.profile }}.json
      ALDI_MANUAL_AUTH_ONCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'live-refill') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-refill-canary]')) }}
      ALDI_TRIGGER_MESSAGE_KEY: ${{ github.event.client_payload.message_key || '' }}
      ALDI_TRIGGER_PRECLAIMED: ${{ github.event.client_payload.preclaimed || false }}
      WATCHER_HEARTBEAT_URL: ${{ secrets.WATCHER_HEARTBEAT_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify automatic live prerequisites
        env:
          ALDI_LOGIN_USER: ${{ secrets[format('ALDI_PROFILE_{0}_LOGIN_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_LOGIN_USER) || '' }}
          ALDI_USER: ${{ secrets[format('ALDI_PROFILE_{0}_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_USER) || '' }}
          ALDI_EXPECTED_ACCOUNT: ${{ secrets.ALDI_EXPECTED_ACCOUNT || secrets[format('ALDI_PROFILE_{0}_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_USER) || '' }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_RECOVERY_KEY: ${{ secrets.ALDI_RECOVERY_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_LOGIN_USER_ENC: ${{ secrets.ALDI_LOGIN_USER_ENC }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
        run: |
          python - <<'PY'
          import os
          plain = bool(os.environ.get('ALDI_PASS')) and bool(
              os.environ.get('ALDI_LOGIN_USER') or os.environ.get('ALDI_USER'))
          encrypted = bool(os.environ.get('CREDENTIAL_ENCRYPTION_KEY')) and bool(
              os.environ.get('ALDI_PASS_ENC')) and bool(
              os.environ.get('ALDI_LOGIN_USER_ENC') or os.environ.get('ALDI_USER_ENC'))
          if not (plain or encrypted):
              raise SystemExit('ALDI credentials are not configured in Actions secrets')
          if not os.environ.get('ALDI_EXPECTED_ACCOUNT'):
              raise SystemExit('ALDI expected account guard is not configured')
          print('Automatic live prerequisites present; secret values are not printed.')
          PY
      - name: Run guarded automatic free 1-GB refill
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets[format('ALDI_PROFILE_{0}_LOGIN_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_LOGIN_USER) || '' }}
          ALDI_USER: ${{ secrets[format('ALDI_PROFILE_{0}_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_USER) || '' }}
          ALDI_EXPECTED_ACCOUNT: ${{ secrets.ALDI_EXPECTED_ACCOUNT || secrets[format('ALDI_PROFILE_{0}_USER', matrix.profile)] || (matrix.profile == 1 && secrets.ALDI_USER) || '' }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_RECOVERY_KEY: ${{ secrets.ALDI_RECOVERY_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_LOGIN_USER_ENC: ${{ secrets.ALDI_LOGIN_USER_ENC }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_LIVE_REPORT: aldi-live-refill.json
        shell: bash
        run: |
          rm -f aldi-live-refill.json
          timeout 180s python github_live_refill.py
      - name: Preserve sanitized live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-live-refill-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-live-refill.json
          retention-days: 7
          if-no-files-found: warn

  public_probe:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'all' || inputs.mode == 'public-probe')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect public portal pages without credentials
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: python portal_probe.py
      - name: Preserve public portal diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-portal-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal-probe-report.json
          retention-days: 7
          if-no-files-found: warn
