name: ALDI Hosted Session (owner-gated, manual only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight without ALDI access, initialize encrypted state, or read-only observe"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - initialize
          - observe
      confirm_provider_authorization:
        description: "I have verified explicit provider approval for scripted account access (not merely account ownership)"
        type: boolean
        required: true
        default: false

# No schedule, workflow_run, repository_dispatch or pull_request trigger.
# Refill and automatic modes remain unreachable from this workflow.
permissions:
  contents: none

concurrency:
  group: aldi-hosted-session-profile-1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'chhubeny90-cell/aldi-watcher' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
    steps:
      - name: Check only configuration presence (no provider request)
        id: gates
        env:
          SELECTED_MODE: ${{ inputs.mode }}
          OWNER_CONFIRMED: ${{ inputs.confirm_provider_authorization }}
          PROVIDER_APPROVED: ${{ vars.ALDI_SCRIPT_ACCESS_APPROVED == 'true' }}
          APPROVAL_REFERENCE_PRESENT: ${{ vars.ALDI_PROVIDER_APPROVAL_REFERENCE != '' }}
          ACCOUNT_PRESENT: ${{ secrets.ALDI_PROFILE_1_USER != '' }}
          PASSWORD_PRESENT: ${{ secrets.ALDI_PASS != '' || secrets.ALDI_PASS_ENC != '' }}
          PASSWORD_ENCRYPTED: ${{ secrets.ALDI_PASS_ENC != '' }}
          CREDENTIAL_KEY_PRESENT: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY != '' }}
          STATE_KEY_PRESENT: ${{ secrets.ALDI_STATE_ENCRYPTION_KEY != '' }}
        run: |
          python - <<'PY'
          import os

          def yes(name):
              return os.environ.get(name, "").lower() == "true"

          checks = {
              "manual_owner_confirmation": yes("OWNER_CONFIRMED"),
              "provider_approval_flag": yes("PROVIDER_APPROVED"),
              "provider_approval_reference_present": yes("APPROVAL_REFERENCE_PRESENT"),
              "target_account_configured": yes("ACCOUNT_PRESENT"),
              "password_configured": yes("PASSWORD_PRESENT"),
              "credential_key_if_needed": not yes("PASSWORD_ENCRYPTED") or yes("CREDENTIAL_KEY_PRESENT"),
              "encrypted_runtime_key_configured": yes("STATE_KEY_PRESENT"),
          }
          ready = all(checks.values()) and os.environ.get("SELECTED_MODE") in ("initialize", "observe")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ready=" + str(ready).lower() + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## ALDI Hosted Session — preflight\n\n")
              summary.write("No ALDI login, provider request or booking was performed by this job.\n\n")
              for key, value in checks.items():
                  summary.write(f"- {key}: {'present' if value else 'missing'}\n")
              summary.write("\nRuntime eligible: **" + ("yes" if ready else "no") + "**.\n")
              summary.write("Explicit provider approval must exist independently of repository settings.\n")
          PY

  session:
    needs: preflight
    # Two independent approval signals plus main-only manual dispatch.
    # Repository variable is unset by default and deliberately not created here.
    if: >-
      needs.preflight.outputs.ready == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'chhubeny90-cell/aldi-watcher' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (inputs.mode == 'initialize' || inputs.mode == 'observe') &&
      inputs.confirm_provider_authorization == true &&
      vars.ALDI_SCRIPT_ACCESS_APPROVED == 'true' &&
      vars.ALDI_PROVIDER_APPROVAL_REFERENCE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: aldi-session
    permissions:
      contents: write # Required for encrypted state/journal CAS; only in gated session job.
    env:
      DRY_RUN: 'true'
      AUTO_BOOK_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install required dependencies
        run: pip install -r requirements.txt
      - name: Set up browser for read-only observe
        if: inputs.mode == 'observe'
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Initialize encrypted state or observe one ALDI session
        env:
          ALDI_HOSTED_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          ALDI_EXPECTED_ACCOUNT: ${{ secrets.ALDI_PROFILE_1_USER }}
          ALDI_USER: ${{ secrets.ALDI_PROFILE_1_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_STATE_ENCRYPTION_KEY: ${{ secrets.ALDI_STATE_ENCRYPTION_KEY }}
          ALDI_HOSTED_REPORT: aldi-hosted-report.json
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: timeout 240s python aldi_hosted_runtime.py --mode "$ALDI_HOSTED_MODE"
      - name: Render sanitized summary (no session artifacts)
        if: always()
        env:
          ALDI_HOSTED_REPORT: aldi-hosted-report.json
        run: python aldi_hosted_runtime.py --summary-only
