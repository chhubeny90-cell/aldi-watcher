name: ALDI Hosted Session (owner-gated manual + cron)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preflight without provider contact, initialize, observe, or one guarded free refill"
        type: choice
        required: true
        default: preflight
        options:
          - preflight
          - initialize
          - observe
          - refill
      confirm_provider_authorization:
        description: "I verified explicit provider approval for scripted account access and approve this manual run"
        type: boolean
        required: true
        default: false
  schedule:
    # The schedule is a wake-up, not permission to contact the provider.
    # GitHub can delay or drop scheduled jobs.
    - cron: '21 * * * *'

# No push, pull_request, workflow_run, mail or repository_dispatch provider triggers.
permissions:
  contents: none

concurrency:
  group: aldi-hosted-session-profile-1
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.repository == 'chhubeny90-cell/aldi-watcher' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
    steps:
      - name: Check only configuration presence (no provider request)
        id: gates
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'automatic' || inputs.mode }}
          OWNER_CONFIRMED: ${{ github.event_name == 'schedule' && vars.ALDI_OWNER_AUTO_REFILL_APPROVED == 'true' || inputs.confirm_provider_authorization == true }}
          PROVIDER_APPROVED: ${{ vars.ALDI_SCRIPT_ACCESS_APPROVED == 'true' }}
          APPROVAL_REFERENCE_PRESENT: ${{ vars.ALDI_PROVIDER_APPROVAL_REFERENCE != '' }}
          BOOKING_APPROVED: ${{ vars.ALDI_LIVE_REFILL_APPROVED == 'true' }}
          ACCOUNT_PRESENT: ${{ secrets.ALDI_PROFILE_1_USER != '' }}
          TARGET_SUFFIX_PRESENT: ${{ secrets.ALDI_REQUIRED_TARGET_SUFFIX != '' }}
          PASSWORD_PRESENT: ${{ secrets.ALDI_PASS != '' || secrets.ALDI_PASS_ENC != '' }}
          PASSWORD_ENCRYPTED: ${{ secrets.ALDI_PASS_ENC != '' }}
          CREDENTIAL_KEY_PRESENT: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY != '' }}
          STATE_KEY_PRESENT: ${{ secrets.ALDI_STATE_ENCRYPTION_KEY != '' }}
        run: |
          python - <<'PY'
          import os

          def yes(name):
              return os.environ.get(name, "").lower() == "true"

          mode = os.environ.get("RUN_MODE")
          booking = mode in ("refill", "automatic")
          checks = {
              "valid_runtime_mode": mode in ("initialize", "observe", "refill", "automatic"),
              "owner_approved": yes("OWNER_CONFIRMED"),
              "provider_approved": yes("PROVIDER_APPROVED"),
              "provider_approval_reference_present": yes("APPROVAL_REFERENCE_PRESENT"),
              "target_account_configured": yes("ACCOUNT_PRESENT"),
              "password_configured": yes("PASSWORD_PRESENT"),
              "credential_key_if_needed": not yes("PASSWORD_ENCRYPTED") or yes("CREDENTIAL_KEY_PRESENT"),
              "encrypted_runtime_key_configured": yes("STATE_KEY_PRESENT"),
              "bookings_approved_if_needed": not booking or yes("BOOKING_APPROVED"),
              "target_suffix_if_booking": not booking or yes("TARGET_SUFFIX_PRESENT"),
          }
          ready = all(checks.values())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("ready=" + str(ready).lower() + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## ALDI Hosted Session — provider-free preflight\n\n")
              summary.write("No ALDI login, status request, booking, or password read was performed here.\n\n")
              for key, value in checks.items():
                  summary.write(f"- {key}: {'yes' if value else 'no'}\n")
              summary.write("\nRuntime eligible: **" + ("yes" if ready else "no") + "**.\n")
              summary.write("Variables alone do not prove provider authorization.\n")
          PY

  session:
    needs: preflight
    # Repository settings are default-deny. Manual and scheduled owner approval
    # have different sources; scheduled runs never need a per-run input.
    if: >-
      needs.preflight.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.repository == 'chhubeny90-cell/aldi-watcher' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      vars.ALDI_SCRIPT_ACCESS_APPROVED == 'true' &&
      vars.ALDI_PROVIDER_APPROVAL_REFERENCE != '' &&
      (
        (github.event_name == 'schedule' &&
         vars.ALDI_OWNER_AUTO_REFILL_APPROVED == 'true' &&
         vars.ALDI_LIVE_REFILL_APPROVED == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.confirm_provider_authorization == true &&
         (inputs.mode == 'initialize' || inputs.mode == 'observe' ||
          (inputs.mode == 'refill' && vars.ALDI_LIVE_REFILL_APPROVED == 'true')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # aldi-auto requires restrictive main-only deployment rules but no human
    # reviewer per cron run; aldi-session can require manual reviewers.
    environment: ${{ github.event_name == 'schedule' && 'aldi-auto' || 'aldi-session' }}
    permissions:
      contents: write # GitHub CAS-persistence of encrypted session and durable journal.
    env:
      AUTO_BOOK_ENABLED: ${{ (github.event_name == 'schedule' || inputs.mode == 'refill') && 'true' || 'false' }}
      DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.mode == 'refill') && 'false' || 'true' }}
      ALDI_MAX_REFILLS_PER_RUN: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install required dependencies
        run: pip install -r requirements.txt
      - name: Set up browser (observe and refill only)
        if: github.event_name == 'schedule' || inputs.mode != 'initialize'
        id: chrome
        uses: browser-actions/setup-chrome@v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Run one guarded hosted session
        env:
          ALDI_HOSTED_MODE: ${{ github.event_name == 'schedule' && 'automatic' || inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          ALDI_SCRIPT_ACCESS_APPROVED: ${{ vars.ALDI_SCRIPT_ACCESS_APPROVED }}
          ALDI_PROVIDER_APPROVAL_REFERENCE: ${{ vars.ALDI_PROVIDER_APPROVAL_REFERENCE }}
          ALDI_OWNER_AUTO_REFILL_APPROVED: ${{ vars.ALDI_OWNER_AUTO_REFILL_APPROVED }}
          ALDI_OWNER_MANUAL_APPROVED: ${{ inputs.confirm_provider_authorization }}
          ALDI_LIVE_REFILL_APPROVED: ${{ vars.ALDI_LIVE_REFILL_APPROVED }}
          ALDI_EXPECTED_ACCOUNT: ${{ secrets.ALDI_PROFILE_1_USER }}
          ALDI_REQUIRED_TARGET_SUFFIX: ${{ secrets.ALDI_REQUIRED_TARGET_SUFFIX }}
          ALDI_USER: ${{ secrets.ALDI_PROFILE_1_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_STATE_ENCRYPTION_KEY: ${{ secrets.ALDI_STATE_ENCRYPTION_KEY }}
          ALDI_HOSTED_REPORT: aldi-hosted-report.json
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: timeout 240s python aldi_hosted_runtime.py --mode "$ALDI_HOSTED_MODE"
      - name: Render sanitized summary (never upload cookies or journal)
        if: always()
        env:
          ALDI_HOSTED_REPORT: aldi-hosted-report.json
        run: python aldi_hosted_runtime.py --summary-only
