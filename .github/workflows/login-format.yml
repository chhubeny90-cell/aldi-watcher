name: ALDI Login Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login_format:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[login-format]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect login identifier format without submitting
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_LOGIN_FORMAT_REPORT: aldi-login-format.json
        run: python aldi_login_format_diagnostic.py
      - name: Preserve sanitized format report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-login-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-login-format.json
          retention-days: 2
          if-no-files-found: warn

  password_reset_probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[reset-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect password-reset form without typing or submitting
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_RESET_PROBE_REPORT: aldi-password-reset-probe.json
        run: python aldi_password_reset_probe.py
      - name: Preserve sanitized reset report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-password-reset-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-password-reset-probe.json
          retention-days: 2
          if-no-files-found: warn

  reset_identifier_probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[reset-id]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate reset identifier without submitting
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_RESET_IDENTIFIER_REPORT: aldi-reset-identifier-probe.json
        run: python aldi_reset_identifier_probe.py
      - name: Preserve sanitized reset identifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-reset-identifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-reset-identifier-probe.json
          retention-days: 2
          if-no-files-found: warn

  passwordless_probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[passwordless-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect passwordless login flow without typing or submitting
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_PASSWORDLESS_PROBE_REPORT: aldi-passwordless-probe.json
        run: python aldi_passwordless_probe.py
      - name: Preserve sanitized passwordless report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-passwordless-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-passwordless-probe.json
          retention-days: 2
          if-no-files-found: warn

  passwordless_stage2:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[passwordless-stage2]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Request one SMS code and inspect code-entry form
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASSWORDLESS_STAGE2_REPORT: aldi-passwordless-stage2.json
        run: python aldi_passwordless_stage2_probe.py
      - name: Preserve sanitized stage-2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-passwordless-stage2-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-passwordless-stage2.json
          retention-days: 1
          if-no-files-found: warn

  password_pointer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[password-pointer]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Try one trusted-pointer password login
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_PASSWORD_POINTER_REPORT: aldi-password-pointer.json
          ALDI_PASSWORD_POINTER_SECONDS: '35'
        run: python aldi_password_pointer_probe.py
      - name: Preserve sanitized password-pointer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-password-pointer-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-password-pointer.json
          retention-days: 1
          if-no-files-found: warn

  public_controls:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[public-controls]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect public login controls without credentials or submit
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_PUBLIC_CONTROLS_REPORT: aldi-public-login-controls.json
        run: python aldi_public_login_controls.py
      - name: Preserve public control report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-public-login-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-public-login-controls.json
          retention-days: 2
          if-no-files-found: warn
