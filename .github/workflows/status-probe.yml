name: ALDI Read-Only Status Probe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  status_probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[status-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUTO_BOOK_ENABLED: 'false'
      ALDI_STATUS_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify read-only guard
        run: |
          test "$AUTO_BOOK_ENABLED" = "false"
          test "$ALDI_STATUS_ONLY" = "true"
      - name: Run ALDI login and usage probe without booking
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_LOGIN_USER_ENC: ${{ secrets.ALDI_LOGIN_USER_ENC }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_STATUS_REPORT: aldi-status-probe.json
        run: |
          rm -f aldi-status-probe.json
          timeout 180s python aldi_status_probe.py
      - name: Preserve sanitized status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-status-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-status-probe.json
          retention-days: 7
          if-no-files-found: warn
