name: Python compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: KI-Box security regression tests (offline)
        run: python -m pytest tests/test_ki_box_receipts.py tests/test_ai_review_hub.py --tb=short -q
      - name: Commit-bound regression evidence (no provider actions)
        run: |
          git rev-parse HEAD
          python -m pytest --tb=short -q

  # Preserve the existing required check name; every matrix entry must pass.
  build-linux:
    if: always()
    needs: python-versions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Python version to pass
        env:
          MATRIX_RESULT: ${{ needs.python-versions.result }}
        run: test "$MATRIX_RESULT" = success
