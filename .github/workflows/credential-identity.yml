name: ALDI Credential Identity
on:
  push:
    branches: [fix/aldi-http-access-20261010]
    paths: [.github/workflows/credential-identity.yml]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-dotenv cryptography
      - name: Identify account endings without contacting ALDI
        env:
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PROFILE_1_USER: ${{ secrets.ALDI_PROFILE_1_USER }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_LOGIN_USER: ${{ secrets.ALDI_LOGIN_USER }}
          ALDI_LOGIN_USER_ENC: ${{ secrets.ALDI_LOGIN_USER_ENC }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from core.credentials import get_credential
          def hint(value):
              value = ''.join((value or '').split())
              return ('…' + value[-4:]) if re.fullmatch(r'\+?\d{9,16}', value) else ('non_phone_identifier' if value else 'missing')
          plain = os.environ.get('ALDI_USER') or ''
          encrypted = get_credential('ALDI_USER') if os.environ.get('ALDI_USER_ENC') else None
          profile = os.environ.get('ALDI_PROFILE_1_USER') or ''
          main_account = encrypted or profile or plain
          login = get_credential('ALDI_LOGIN_USER') or main_account
          result = {
              'aldi_network_requests': 0,
              'password_accessed': False,
              'http_probe_account_hint': hint(plain),
              'main_account_hint': hint(main_account),
              'main_login_hint': hint(login),
              'profile_override_configured': bool(profile),
              'encrypted_account_configured': bool(encrypted),
              'separate_login_configured': bool(os.environ.get('ALDI_LOGIN_USER') or os.environ.get('ALDI_LOGIN_USER_ENC'))
          }
          with open('aldi-credential-identity.json', 'w') as f:
              json.dump(result, f, indent=2)
          print('Account identity report written; no ALDI connection or password access.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aldi-credential-identity-${{ github.run_id }}
          path: aldi-credential-identity.json
          retention-days: 1
