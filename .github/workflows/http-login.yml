name: ALDI HTTP Login
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: aldi-live-refill-profile-1
  cancel-in-progress: false
jobs:
  login:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[http-login]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Try one browser-free phone and password login
        env:
          ALDI_USER: ${{ secrets.ALDI_PROFILE_1_USER || secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_HTTP_REPORT: aldi-http-login.json
        run: timeout 150s python aldi_http_login_probe.py
      - name: Preserve sanitized login result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-http-login-${{ github.run_id }}
          path: aldi-http-login.json
          retention-days: 3
