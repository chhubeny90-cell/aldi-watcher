name: ALDI Guarded Free Refill (disabled)

on:
  workflow_dispatch:

permissions:
  contents: none

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain why no provider request is made
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## BLOCKED — kein ALDI-Kontakt

          Automatisierte Portalzugriffe und Buchungsklicks sind ohne ausdrückliche Anbieterfreigabe gesperrt. Es wird kein Angebot geladen, kein Klick ausgelöst und kein Journal verändert.

          Dieser Workflow führt weder Anmeldung noch Statusabfrage, Reset, Buchung oder Wiederholung aus. Nutze für eine Konto-Prüfung ausschließlich die offizielle ALDI-TALK-App oder das Portal manuell.
          EOF
          echo "::error::ALDI provider automation is disabled; no provider request was made."
          exit 2
