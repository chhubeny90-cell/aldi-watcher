name: ALDI Guarded Free Refill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-refill.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight or one provider-confirmed free 1-GB refill
        required: true
        default: preflight
        type: choice
        options: [preflight, refill]

permissions:
  contents: read

concurrency:
  group: aldi-live-refill-profile-1
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check configuration without reading or printing secret values
        id: config
        env:
          ACCOUNT_CONFIGURED: ${{ secrets.ALDI_PROFILE_1_USER != '' || secrets.ALDI_USER != '' || secrets.ALDI_USER_ENC != '' }}
          EXPECTED_ACCOUNT_CONFIGURED: ${{ secrets.ALDI_PROFILE_1_USER != '' }}
          PASSWORD_CONFIGURED: ${{ secrets.ALDI_PASS != '' || secrets.ALDI_PASS_ENC != '' }}
          ENCRYPTION_KEY_REQUIRED: ${{ secrets.ALDI_USER_ENC != '' || secrets.ALDI_PASS_ENC != '' }}
          ENCRYPTION_KEY_CONFIGURED: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY != '' }}
          JOURNAL_PATH_CONFIGURED: ${{ vars.ALDI_JOURNAL_PATH != '' }}
          MAILBOX_CONFIGURED: ${{ (secrets.MAILBOX_1_USER != '' && secrets.MAILBOX_1_PASS != '') || (secrets.MAILBOX_2_USER != '' && secrets.MAILBOX_2_PASS != '') }}
          MAIL_DEDUP_KEY_CONFIGURED: ${{ secrets.ALDI_RECOVERY_KEY != '' }}
        run: |
          python - <<'PY'
          import json, os
          names = ('ACCOUNT_CONFIGURED', 'EXPECTED_ACCOUNT_CONFIGURED', 'PASSWORD_CONFIGURED',
                   'ENCRYPTION_KEY_REQUIRED', 'ENCRYPTION_KEY_CONFIGURED', 'JOURNAL_PATH_CONFIGURED',
                   'MAILBOX_CONFIGURED', 'MAIL_DEDUP_KEY_CONFIGURED')
          flags = {name.lower(): os.environ.get(name) == 'true' for name in names}
          ready = all(flags[name] for name in ('account_configured', 'expected_account_configured',
                                               'password_configured', 'journal_path_configured'))
          ready = ready and flags['mailbox_configured'] and flags['mail_dedup_key_configured']
          ready = ready and (not flags['encryption_key_required'] or flags['encryption_key_configured'])
          print(json.dumps({'configuration': flags, 'manual_refill_configured': ready,
                            'runner_available': 'unverified', 'live_booking_verified': False,
                            'recurring_booking_enabled': False}, sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('ready=' + str(ready).lower() + '\n')
          PY

  test:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  refill:
    needs: [preflight, test]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refill' && needs.preflight.outputs.ready == 'true'
    runs-on: [self-hosted, linux, aldi-journal]
    timeout-minutes: 8
    env:
      AUTO_BOOK_ENABLED: 'true'
      ALDI_MAX_REFILLS_PER_RUN: '1'
      ALDI_REQUIRED_TARGET_SUFFIX: ${{ vars.ALDI_REQUIRED_TARGET_SUFFIX }}
      ALDI_JOURNAL_PATH: ${{ vars.ALDI_JOURNAL_PATH }}
      ALDI_EXPECTED_ACCOUNT: ${{ secrets.ALDI_PROFILE_1_USER }}
      ALDI_USER: ${{ secrets.ALDI_PROFILE_1_USER || secrets.ALDI_USER }}
      ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
      ALDI_LOGIN_USER: ${{ secrets.ALDI_PROFILE_1_LOGIN_USER || secrets.ALDI_LOGIN_USER }}
      ALDI_PASS: ${{ secrets.ALDI_PASS }}
      ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      ALDI_LIVE_REPORT: aldi-live-refill.json
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Validate target and execute one guarded free refill
        run: |
          python - <<'PY'
          import os
          import watcher
          from core.aldi_http_login import phone_identifier
          if not watcher.configure_credentials('ALDI'):
              raise SystemExit('credentials_unavailable')
          if phone_identifier(watcher.ALDI_ACCOUNT_USER) != phone_identifier(os.environ['ALDI_EXPECTED_ACCOUNT']):
              raise SystemExit('target_account_mismatch')
          import aldi_live_refill_contract
          raise SystemExit(aldi_live_refill_contract.main())
          PY
      - name: Preserve sanitized completion report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: guarded-free-refill-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-live-refill.json
          retention-days: 7
          if-no-files-found: warn
