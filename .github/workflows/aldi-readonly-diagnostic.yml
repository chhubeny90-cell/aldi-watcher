name: ALDI read-only diagnostic

on:
  push:
    branches:
      - hardening/aldi-readonly-refill-evidence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aldi-readonly-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run sanitized ALDI auth and evidence probe
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_ACCOUNT_SELECTOR: ${{ vars.ALDI_ACCOUNT_SELECTOR }}
          ALDI_ACTIVE_TARIFF_SELECTOR: ${{ vars.ALDI_ACTIVE_TARIFF_SELECTOR }}
          ALDI_REFILL_OFFER_SELECTOR: ${{ vars.ALDI_REFILL_OFFER_SELECTOR }}
          ALDI_REFILL_BUTTON_SELECTOR: ${{ vars.ALDI_REFILL_BUTTON_SELECTOR }}
          ALDI_REFILL_SUCCESS_SELECTOR: ${{ vars.ALDI_REFILL_SUCCESS_SELECTOR }}
          ALDI_REFILL_RECONCILE_SELECTOR: ${{ vars.ALDI_REFILL_RECONCILE_SELECTOR }}
          ALDI_AUTH_DIAGNOSTIC: 'true'
          AUTO_BOOK_ENABLED: 'false'
        run: python tools/aldi_pointer_auth_probe.py
      - name: Preserve sanitized ALDI diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-readonly-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: monitoring-report.json
          retention-days: 7
          if-no-files-found: warn
