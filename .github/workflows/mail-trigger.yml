name: ALDI Usage Mail Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: aldi-usage-mail-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/mail-monitor.txt
      - name: Install dependencies
        run: pip install -r requirements/mail-monitor.txt
      - name: Poll usage mailboxes without ALDI portal access
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALDI_RECOVERY_KEY: ${{ secrets.ALDI_RECOVERY_KEY }}
          ALDI_STATE_PATH: .aldi-state/profile-1.json
          MAILBOX_1_HOST: ${{ secrets.MAILBOX_1_USER && (secrets.MAILBOX_1_HOST || 'imap.gmail.com') || '' }}
          MAILBOX_1_PORT: ${{ secrets.MAILBOX_1_PORT }}
          MAILBOX_1_USER: ${{ secrets.MAILBOX_1_USER }}
          MAILBOX_1_PASS: ${{ secrets.MAILBOX_1_PASS }}
          MAILBOX_2_HOST: ${{ secrets.MAILBOX_2_USER && (secrets.MAILBOX_2_HOST || 'imap.gmail.com') || '' }}
          MAILBOX_2_PORT: ${{ secrets.MAILBOX_2_PORT }}
          MAILBOX_2_USER: ${{ secrets.MAILBOX_2_USER }}
          MAILBOX_2_PASS: ${{ secrets.MAILBOX_2_PASS }}
          ALDI_MAIL_NOTIFY_REPORT: aldi-usage-alert.json
        run: python usage_mail_notify.py
      - name: Preserve sanitized usage-alert report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aldi-usage-alert-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-usage-alert.json
          retention-days: 7
          if-no-files-found: error
      - name: Surface refill-ready mail or mailbox failure
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('aldi-usage-alert.json')
          if not path.is_file():
              print('::error title=ALDI mail monitor::Sanitized report missing')
              raise SystemExit(2)
          report = json.loads(path.read_text(encoding='utf-8'))
          config_error = report.get('configuration_error')
          actionable = int(report.get('actionable_alerts') or 0)
          early = int(report.get('early_warnings') or 0)
          failures = report.get('failed_mailboxes') or []
          if config_error:
              print('::error title=ALDI mail monitor::Monitor configuration incomplete: ' + str(config_error))
              raise SystemExit(2)
          if failures:
              print('::error title=ALDI mail monitor::One or more mailboxes could not be checked.')
              if actionable:
                  print(f'::warning title=ALDI refill ready::{actionable} consumed-volume signal(s) detected; no provider action dispatched.')
              raise SystemExit(2)
          if actionable:
              print(f'::warning title=ALDI refill ready::{actionable} consumed-volume signal(s) detected; no provider action dispatched.')
              raise SystemExit(1)
          if early:
              print(f'ALDI early warning only: {early} 80-percent signal(s); no activation link yet.')
          else:
              print('No new ALDI refill-ready signal.')
          PY
