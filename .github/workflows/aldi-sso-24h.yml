name: ALDI SSO 24h Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'aldi_sso_diagnostic.py'
      - '.github/workflows/aldi-sso-24h.yml'
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: aldi-sso-24h-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check diagnostic window
        id: window
        shell: bash
        run: |
          now="$(date -u +%s)"
          end="$(date -u -d '2026-10-11T01:45:00Z' +%s)"
          if [ "$now" -le "$end" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "24-hour diagnostic window active."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "24-hour diagnostic window finished; no login will be attempted."
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        if: steps.window.outputs.active == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install dependencies
        if: steps.window.outputs.active == 'true'
        run: pip install -r requirements.txt

      - name: Run one sanitized SSO observation
        if: steps.window.outputs.active == 'true'
        continue-on-error: true
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_USER: ${{ secrets.ALDI_USER }}
          ALDI_PASS: ${{ secrets.ALDI_PASS }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ALDI_USER_ENC: ${{ secrets.ALDI_USER_ENC }}
          ALDI_PASS_ENC: ${{ secrets.ALDI_PASS_ENC }}
          ALDI_SSO_OBSERVE_SECONDS: '120'
          ALDI_SSO_SAMPLE_SECONDS: '5'
          ALDI_SSO_REPORT: 'aldi-sso-diagnostic.json'
          AUTO_BOOK_ENABLED: 'false'
        run: python aldi_sso_diagnostic.py

      - name: Preserve sanitized diagnostics
        if: steps.window.outputs.active == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-sso-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-sso-diagnostic.json
          retention-days: 3
          if-no-files-found: warn

      - name: Assert no booking mode
        if: steps.window.outputs.active == 'true' && always()
        run: |
          test "${AUTO_BOOK_ENABLED:-false}" != "true"
          echo "Diagnostic is login/observation only; booking stays disabled."
