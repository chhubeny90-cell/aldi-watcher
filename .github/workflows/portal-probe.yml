name: Public portal diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: pip install -r requirements.txt
      - name: Inspect public pages without credentials
        run: |
          echo 'Public-page diagnosis only; success does not establish authenticated monitoring or booking readiness.' >> "$GITHUB_STEP_SUMMARY"
          python portal_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-portal-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: portal-probe-report.json
          retention-days: 7
          if-no-files-found: error
