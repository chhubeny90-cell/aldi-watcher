name: ALDI Initial Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initial_challenge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[initial-challenge]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Observe initial ALDI challenge without credentials
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          ALDI_INITIAL_CHALLENGE_REPORT: aldi-initial-challenge.json
        run: python aldi_initial_challenge_probe.py
      - name: Preserve sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aldi-initial-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: aldi-initial-challenge.json
          retention-days: 1
          if-no-files-found: warn
