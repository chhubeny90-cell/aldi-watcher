name: Windows Mail Sensor Offline

on:
  pull_request:
    branches: [main]
    paths:
      # Cover transitive imports (core/config/security and root-level bridges),
      # not just the IMAP sensor entrypoint. Offline only; no credentials.
      - 'core/**'
      - '*.py'
      - 'requirements*.txt'
      - 'scripts/windows/**'
      - 'tests/test_imap_sensor_daemon.py'
      - 'tests/test_dual_monitor_policy.py'
      - 'tests/test_dual_monitor_bridge.py'
      - '.github/workflows/mail-sensor-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTO_BOOK_ENABLED: 'false'
  ALDI_IMAP_MONITOR_ENABLED: 'false'

jobs:
  windows_offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install sensor test dependencies only
        run: python -m pip install 'pytest>=8' 'pytest-asyncio>=0.23' 'requests>=2.32,<3' 'python-dotenv>=1' 'cryptography>=42'
      - name: Test SQLite reopen, UID recovery and synthetic IMAP faults on Windows
        run: python -m pytest tests/test_imap_sensor_daemon.py tests/test_dual_monitor_policy.py tests/test_dual_monitor_bridge.py -q
      - name: Parse task preparation script without registering or starting a task
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/windows/Register-MailSensor.ps1'),
            [ref]$Tokens, [ref]$Errors)
          if ($Errors.Count -gt 0) { throw 'Task script failed native PowerShell parsing' }
          Write-Output 'Task script parsed; no task registered or started.'
